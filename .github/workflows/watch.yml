name: EU Project Watcher

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run watcher
        env:
          WATCH_URLS: "https://ec.europa.eu/info/funding-tenders/opportunities/portal/screen/how-to-participate/topic-announcements/50133351"
          KEYWORDS: "governance,public policy and administration,science technology and innovation policy,digital sovereignty,open strategic autonomy,competitiveness,sustainability,ethics of care,just and resilient cities,participatory design,living labs,spatial inequalities,dual-use energy systems,energy resilience,rare-earth recycling,critical raw materials,in-space servicing,responsible ai,green chemistry,direct current microgrids"
        run: |
          python agent.py
          
